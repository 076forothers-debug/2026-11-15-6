<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>第六關 · 月之城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>

  /* ============ 設計參數（Design Tokens） ============ */
  :root{
    --bg-deep: #0A0E27;
    --bg-deep2: #12163d;
    --moon-silver: #EDEBF7;
    --moon-shadow: #0A0E27;
    --star-gold: #F4C95D;
    --star-gold-soft: #B08D57;
    --seine-blue: #4A7C9E;
    --wine: #6B2737;
    --wine-bright: #9C3B4C;
    --parchment: #EAD9B4;
    --ink: #2B2013;

    --font-display: 'Noto Serif TC', serif;
    --font-accent: 'Cinzel', serif;
    --font-body: 'Noto Serif TC', serif;
    --font-ui: 'Noto Sans TC', sans-serif;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-deep2) 0%, var(--bg-deep) 55%, #060815 100%);
    color: var(--moon-silver);
    font-family: var(--font-body);
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ============ 星空背景 ============ */
  #starfield{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-star{
    position:absolute; border-radius:50%;
    background: var(--moon-silver);
    opacity:0.6;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.85; }
  }

  /* ============ 舞台 / 場景 ============ */
  .stage{
    position:relative; z-index:2;
    width:100%; max-width:640px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .scene{
    display:none;
    animation: fadeUp 0.9s ease both;
  }
  .scene.scene--active{ display:block; }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card{
    position:relative;
    background: linear-gradient(180deg, rgba(18,22,61,0.55), rgba(10,14,39,0.75));
    border: 1px solid rgba(237,235,247,0.16);
    border-radius: 2px;
    padding: 44px 34px 38px;
    backdrop-filter: blur(6px);
  }
  .card::before, .card::after{
    content:""; position:absolute; width:14px; height:14px;
    border: 1px solid var(--star-gold-soft); opacity:0.7;
  }
  .card::before{ top:8px; left:8px; border-right:none; border-bottom:none; }
  .card::after{ bottom:8px; right:8px; border-left:none; border-top:none; }

  .eyebrow{
    font-family: var(--font-accent);
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--star-gold);
    text-align:center;
    margin: 0 0 6px;
    text-transform:uppercase;
  }
  .title{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 26px;
    letter-spacing: 2px;
    text-align:center;
    margin: 0 0 30px;
    color: var(--moon-silver);
  }

  /* ============ 月亮徽章（貫穿全場景的簽名元素） ============ */
  .moon-wrap{
    display:flex; justify-content:center; margin-bottom: 22px;
  }
  .moon-orbit{
    position:relative; width: 168px; height:168px;
  }
  .moon-disc{
    position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle at 35% 32%, #ffffff, var(--moon-silver) 55%, #cfd0e6 100%);
    box-shadow: 0 0 40px 6px rgba(237,235,247,0.35), 0 0 90px 20px rgba(244,201,93,0.08);
  }
  .moon-shade{
    position:absolute; inset:0; border-radius:50%;
    background: var(--bg-deep);
    transform: translateX(58%);
    transition: transform 1.4s cubic-bezier(.4,0,.2,1);
  }
  /* 月相控制：資料屬性決定陰影位移 */
  .moon-orbit[data-phase="new"]      .moon-shade{ transform: translateX(6%); }
  .moon-orbit[data-phase="crescent"] .moon-shade{ transform: translateX(46%); }
  .moon-orbit[data-phase="gibbous"]  .moon-shade{ transform: translateX(78%) scale(1.15); opacity:0.0; }
  .moon-orbit[data-phase="full"]     .moon-shade{ transform: translateX(120%); }

  .star-orbit-item{
    position:absolute; top:50%; left:50%;
    width:14px; height:14px; margin:-7px;
    transform-origin: center;
  }
  .star-orbit-item svg{ width:100%; height:100%; display:block; }
  .star-orbit-item .pt{ fill: var(--star-gold-soft); opacity:0.35; transition: all .6s ease; }
  .star-orbit-item.active .pt{ fill: var(--star-gold); opacity:1; filter: drop-shadow(0 0 4px var(--star-gold)); }
  .star-orbit-item.brand-new .pt{ fill: var(--star-gold); opacity:1; filter: drop-shadow(0 0 8px var(--star-gold)); }

  .star-count{
    text-align:center; font-family: var(--font-ui); font-size:13px;
    letter-spacing:3px; color: var(--star-gold-soft); margin-top:2px;
  }
  .star-count b{ color: var(--star-gold); font-weight:600; }

  /* ============ 敘事文字（逐行淡入） ============ */
  .narrative{ min-height: 170px; margin-bottom: 8px; }
  .narrative p{
    font-size: 17px; line-height:1.9; text-align:center;
    color: var(--moon-silver); margin: 0 0 10px;
    opacity:0; transform: translateY(10px);
    animation: lineIn 0.8s ease forwards;
  }

  @keyframes lineIn{ to{ opacity:1; transform:translateY(0); } }

  /* ============ 許願瓶＋可互動星星（開場） ============ */
  .bottle-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom: 8px; }
  .bottle-stage{ position:relative; width:180px; height:230px; margin: 0 auto; overflow:hidden; }
  .bottle-svg{ width:100%; height:100%; display:block; overflow:visible; }
  .bottle-glass{ fill: rgba(74,124,158,0.14); stroke: var(--star-gold-soft); stroke-width:1.5; }
  .bottle-cork{ fill: var(--star-gold-soft); opacity:0.9; }
  .bottle-star{ fill: var(--star-gold); opacity:0.9; }
  .bottle-star.new-star{
    opacity:0; transform-box: fill-box; transform-origin: center;
  }
  .bottle-star.new-star.pop{ animation: starPop 0.7s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes starPop{
    0%{ opacity:0; transform: scale(0.2); }
    55%{ opacity:1; transform: scale(1.35); }
    100%{ opacity:1; transform: scale(0.85); filter: drop-shadow(0 0 6px var(--star-gold)); }
  }

  .catch-star{
    position:absolute; left:50%; top:10px; width:36px; height:36px;
    margin-left:-18px; cursor:pointer; z-index:3;
    filter: drop-shadow(0 0 7px var(--star-gold));
    animation: catchTwinkle 2.1s ease-in-out infinite;
  }
  .catch-star svg{ width:100%; height:100%; display:block; }
  .catch-star .pt{ fill: var(--star-gold); }
  .catch-star:active{ transform: scale(0.9); }
  .catch-star.falling{
    animation: starFall 0.85s cubic-bezier(.55,0,.85,.35) forwards;
    pointer-events:none;
  }
  .catch-star.caught{ display:none; }
  @keyframes catchTwinkle{
    0%,100%{ transform: translateY(0) scale(1); opacity:0.85; }
    50%{ transform: translateY(-6px) scale(1.08); opacity:1; }
  }
  @keyframes starFall{
    0%{ transform: translateY(0) scale(1); opacity:1; }
    65%{ opacity:1; }
    100%{ transform: translateY(70px) scale(0.35); opacity:0; }
  }

  .bottle-hint{
    text-align:center; font-family: var(--font-ui); font-size:12px;
    letter-spacing:2px; color: rgba(237,235,247,0.45); margin-top:2px;
    transition: opacity .3s ease;
  }

  /* ============ 按鈕 ============ */
  .btn-row{ display:flex; justify-content:center; margin-top: 26px; }
  .btn{
    font-family: var(--font-ui); font-size:14px; letter-spacing:2px;
    background: transparent;
    color: var(--star-gold);
    border: 1px solid var(--star-gold-soft);
    padding: 13px 30px;
    cursor:pointer;
    transition: all .3s ease;
    opacity:0; pointer-events:none;
  }
  .btn.show{ opacity:1; pointer-events:auto; animation: fadeUp 0.7s ease; }
  .btn:hover{ background: rgba(244,201,93,0.1); border-color: var(--star-gold); }
  .btn:active{ transform: scale(0.98); }
  .btn.danger{ color: var(--wine-bright); border-color: var(--wine); }
  .btn.danger:hover{ background: rgba(156,59,76,0.12); }

  /* ============ QR 掃描場景 ============ */
  .scanner-frame{
    position:relative; width:100%; aspect-ratio: 1/1; max-width:360px;
    margin: 0 auto 18px; overflow:hidden; border-radius:2px;
    border:1px solid rgba(237,235,247,0.2);
    background:#000;
  }
  .scanner-frame video{ width:100%; height:100%; object-fit:cover; display:block; }
  .scan-guide{
    position:absolute; inset: 14%; border: 1.5px solid var(--star-gold);
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    opacity:0.85;
  }
  .scan-guide::before, .scan-guide::after{
    content:""; position:absolute; width:100%; height:2px; left:0;
    background: linear-gradient(90deg, transparent, var(--star-gold), transparent);
  }
  .scan-line{
    position:absolute; left:14%; right:14%; height:2px;
    background: linear-gradient(90deg, transparent, var(--star-gold), transparent);
    top:14%;
    animation: scanMove 2.2s ease-in-out infinite;
  }
  @keyframes scanMove{ 0%,100%{ top:14%; } 50%{ top:82%; } }
  .scan-line.paused{ animation-play-state: paused; opacity:0; }

  .qr-result-wrap{
    position:absolute; inset: 14%; z-index:5;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg-deep);
    opacity:0; transform: scale(0.92);
    transition: opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  .qr-result-wrap.show{ opacity:1; transform: scale(1); }
  .qr-result-wrap img{ width:100%; height:100%; object-fit:contain; }

  .tap-to-play{
    position:absolute; inset:0; width:100%; height:100%;
    background: rgba(10,14,39,0.75); color: var(--star-gold);
    border:none; font-family: var(--font-ui); font-size:14px; letter-spacing:1.5px;
    line-height:1.8; cursor:pointer; z-index:4;
  }
  .status-line{
    text-align:center; font-family: var(--font-ui); font-size:14px;
    color: var(--moon-silver); opacity:0.85; min-height: 22px; margin-bottom:8px;
  }
  .status-line.ok{ color: var(--star-gold); }
  .status-line.warn{ color: var(--wine-bright); }

  /* ============ 答案輸入場景 ============ */
  .answer-form{ display:flex; flex-direction:column; align-items:center; gap:16px; margin-top: 10px; }
  .answer-input{
    width:100%; max-width:320px;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--star-gold-soft);
    color: var(--moon-silver);
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 3px;
    text-align:center;
    padding: 10px 4px;
    outline:none;
  }
  .answer-input:focus{ border-color: var(--star-gold); }
  .hint{
    text-align:center; font-family: var(--font-ui); font-size:13px;
    color: var(--wine-bright); min-height:18px; opacity:0;
  }
  .hint.show{ opacity:0.9; animation: shake 0.4s ease; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  /* ============ 藏寶圖揭曉場景 ============ */
  .reveal-frame{
    position:relative; padding: 14px; background: rgba(234,217,180,0.05);
    border: 1px solid var(--star-gold-soft);
  }
  .reveal-frame img{
    width:100%; display:block; box-shadow: 0 0 60px rgba(244,201,93,0.15);
  }
  .reveal-caption{
    text-align:center; font-family: var(--font-accent); font-size:13px;
    letter-spacing:3px; color: var(--star-gold); margin-top:18px;
  }

  .fine-print{
    text-align:center; font-family: var(--font-ui); font-size:12px;
    color: rgba(237,235,247,0.35); margin-top: 22px; letter-spacing:1px;
  }

  @media (max-width: 420px){
    .card{ padding: 34px 20px 30px; }
    .title{ font-size: 21px; }
    .narrative p{ font-size:15.5px; }
  }
</style>
</head>
<body>

<div id="starfield"></div>
<audio id="bgm" src="bgm6.m4a" loop preload="auto" playsinline></audio>

<div class="stage">

  <!-- 場景 0：拾星 -->
  <section class="scene scene--active" id="scene-pickup">
    <div class="card">
      <p class="eyebrow">Chapitre VI</p>
      <h1 class="title">拾星</h1>

      <div class="bottle-wrap">
        <div class="bottle-stage" id="bottleStage">
          <svg class="bottle-svg" viewBox="0 0 160 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="bottleClip">
                <path d="M70,18 L90,18 L90,55 C112,66 128,92 128,130 C128,178 100,212 80,212 C60,212 32,178 32,130 C32,92 48,66 70,55 Z"/>
              </clipPath>
            </defs>
            <path class="bottle-glass" d="M70,18 L90,18 L90,55 C112,66 128,92 128,130 C128,178 100,212 80,212 C60,212 32,178 32,130 C32,92 48,66 70,55 Z"/>
            <rect class="bottle-cork" x="66" y="4" width="28" height="18" rx="4"/>
            <g clip-path="url(#bottleClip)">
              <!-- 原本已收集的五顆星星 -->
              <g class="bottle-star" transform="translate(54,156) scale(0.68)"><path d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></g>
              <g class="bottle-star" transform="translate(76,170) scale(0.6)"><path d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></g>
              <g class="bottle-star" transform="translate(92,148) scale(0.64)"><path d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></g>
              <g class="bottle-star" transform="translate(63,182) scale(0.5)"><path d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></g>
              <g class="bottle-star" transform="translate(85,189) scale(0.55)"><path d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></g>
              <!-- 第六顆星星：點擊落下後才會出現 -->
              <g class="bottle-star new-star" id="bottleStarNew" transform="translate(72,164) scale(0.74)"><path d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></g>
            </g>
          </svg>
          <div class="catch-star" id="catchStar" onclick="catchTheStar()">
            <svg viewBox="0 0 24 24"><path class="pt" d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></svg>
          </div>
        </div>
        <p class="star-count" id="star-count-0">星星 <b>5</b> / 6</p>
        <p class="bottle-hint" id="bottleHint">✦ 點一下那顆星星 ✦</p>
      </div>

      <div class="narrative" id="narrative-0"></div>

      <div class="btn-row">
        <button class="btn" id="btn-0" onclick="goToScene('scene-warning')">啟程前往月之城</button>
      </div>
    </div>
  </section>

  <!-- 場景 1：警示與啟程 -->
  <section class="scene" id="scene-warning">
    <div class="card">
      <p class="eyebrow">La Cité de la Lune</p>
      <h1 class="title">塞納河畔・月之城</h1>

      <div class="moon-wrap">
        <div class="moon-orbit" data-phase="gibbous" id="moon-1">
          <div class="moon-disc"></div>
          <div class="moon-shade"></div>
          <div class="stars-orbit" data-count="6"></div>
        </div>
      </div>
      <p class="star-count">星星 <b>6</b> / 6 · 已集齊</p>

      <div class="narrative" id="narrative-1"></div>

      <div class="btn-row">
        <button class="btn danger" id="btn-1" onclick="goToScene('scene-scan')">掃描守城人的 QR Code</button>
      </div>
    </div>
  </section>

  <!-- 場景 2：QR 掃描 -->
  <section class="scene" id="scene-scan">
    <div class="card">
      <p class="eyebrow">守城人之印</p>
      <h1 class="title">出示你的星辰印記</h1>

      <div class="scanner-frame" id="scannerFrame">
        <video id="qrVideo" playsinline muted autoplay></video>
        <div class="scan-guide"></div>
        <div class="scan-line" id="scanLine"></div>
        <div class="qr-result-wrap" id="qrResultWrap">
          <img src="qrcode.png" alt="已掃描到的 QR Code">
        </div>
        <button type="button" id="tapToPlay" class="tap-to-play" style="display:none;">畫面卡住了嗎？<br>點這裡繼續</button>
      </div>
      <p class="status-line" id="scanStatus">請將守城人給的 QR Code 對準框內</p>

      <div class="btn-row">
        <button class="btn show" id="btn-start-scan" onclick="startScanner()">開始掃描</button>
        <button class="btn" id="btn-scan-continue" style="display:none;" onclick="goToScene('scene-answer')">繼續前往下一關</button>
      </div>
    </div>
  </section>

  <!-- 場景 3：輸入答案 -->
  <section class="scene" id="scene-answer">
    <div class="card">
      <p class="eyebrow">守城人低語</p>
      <h1 class="title">請說出通關密語</h1>

      <div class="narrative">
        <p style="opacity:1; animation:none;">星星已為你證明身份，守城人願再考你一題。</p>
      </div>

      <form class="answer-form" onsubmit="return checkAnswer(event)">
        <input type="text" class="answer-input" id="answerInput" placeholder="在此輸入答案" autocomplete="off">
        <p class="hint" id="answerHint">尚未答對，再想想……</p>
        <button type="submit" class="btn show">確認答案</button>
      </form>
    </div>
  </section>

  <!-- 場景 4：藏寶圖揭曉 -->
  <section class="scene" id="scene-reveal">
    <div class="card">
      <p class="eyebrow">入城許可・已核發</p>
      <h1 class="title">藏寶圖</h1>

      <div class="reveal-frame">

<script>
/* =========================================================
   可調整設定：通關答案
   （QR Code 不檢查內容，掃到任何 QR Code 就直接進入下一頁）
   ========================================================= */
const CORRECT_ANSWER = "NtHu_cOuple";   // 下一頁要輸入的正確答案（比對時不分大小寫）

/* ---------------- 背景音樂 ---------------- */
(function initBGM(){
  const audio = document.getElementById('bgm');
  if(!audio) return;
  const tryPlay = ()=> audio.play().catch(()=>{});
  tryPlay();
  // iOS Safari 通常需要一次使用者互動才能播放音訊，這裡在第一次點擊/觸控時補一次
  const unlock = ()=>{
    tryPlay();
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('click', unlock);
  };
  document.addEventListener('touchstart', unlock, {once:true});
  document.addEventListener('click', unlock, {once:true});
})();

/* ---------------- 星空背景 ---------------- */
(function initStarfield(){
  const field = document.getElementById('starfield');
  const count = 90;
  for(let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'bg-star';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    s.style.animationDuration = (2.5+Math.random()*3)+'s';
    field.appendChild(s);
  }
})();

/* ---------------- 星軌繪製（月亮周圍 6 顆星） ---------------- */
function buildOrbit(container, activeCount, opts){
  opts = opts || {};
  const radius = 92;
  container.innerHTML = '';
  for(let i=0;i<6;i++){
    const angle = (Math.PI*2/6)*i - Math.PI/2;
    const x = 84 + radius*0.42*Math.cos(angle);
    const y = 84 + radius*0.42*Math.sin(angle);
    const item = document.createElement('div');
    item.className = 'star-orbit-item' + (i < activeCount ? ' active' : '');
    if(opts.newIndex === i) item.classList.add('brand-new');
    item.style.left = x+'px';
    item.style.top = y+'px';
    item.innerHTML = '<svg viewBox="0 0 24 24"><path class="pt" d="M12 0 L14.6 8.4 L23.5 8.4 L16.3 13.6 L18.9 22 L12 16.8 L5.1 22 L7.7 13.6 L0.5 8.4 L9.4 8.4 Z"/></svg>';
    container.appendChild(item);
  }
}
buildOrbit(document.querySelector('#moon-1 .stars-orbit'), 6);

/* ---------------- 場景切換 ---------------- */
let activeStream = null;

function goToScene(id){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('scene--active'));
  document.getElementById(id).classList.add('scene--active');
  if(id !== 'scene-scan') stopScanner();
  window.scrollTo({top:0, behavior:'smooth'});

  if(id === 'scene-warning') playNarrative1();
}

/* ---------------- 逐行敘事文字 ---------------- */
function typeLines(containerId, lines, delayBetween, onDone){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  lines.forEach((line, idx)=>{
    const p = document.createElement('p');
    p.textContent = line;
    p.style.animationDelay = (idx*delayBetween)+'s';
    el.appendChild(p);
  });
  if(onDone){
    setTimeout(onDone, lines.length*delayBetween*1000 + 500);
  }
}

/* ---------------- 場景 0：拾星（可互動） ---------------- */
function playIntro(){
  typeLines('narrative-0', [
    '古老的王遺留了一顆星星在人間',
    '恰好被你給撿到了'
  ], 1.1);
}

let starCaught = false;
function catchTheStar(){
  if(starCaught) return;
  starCaught = true;

  const star = document.getElementById('catchStar');
  const hint = document.getElementById('bottleHint');
  star.classList.add('falling');
  hint.style.opacity = '0';

  setTimeout(()=>{
    star.classList.add('caught');
    document.getElementById('bottleStarNew').classList.add('pop');
    document.getElementById('star-count-0').innerHTML = '星星 <b>6</b> / 6';
    document.getElementById('btn-0').classList.add('show');
  }, 800);
}

/* ---------------- 場景 1：警示敘事 ---------------- */
let narrative1Played = false;
function playNarrative1(){
  if(narrative1Played) return;
  narrative1Played = true;
  typeLines('narrative-1', [
    '現在，拿著你集齊的六顆星星',
    '前往塞納河畔的月之城',
    '要記得小心守城人',
    '若您在其面前露出笑容',
    '您將失去入城資格',
    '現在，去吧，勇士',
    '吾相信這些星星足以向守城人證明你的身份'
  ], 1.0, ()=>{
    document.getElementById('btn-1').classList.add('show');
  });
}

/* ---------------- 場景 2：QR 掃描（畫面維持相機掃描樣式，8 秒後模擬掃到 QR） ---------------- */
async function tryPlayVideo(video, statusEl, tapBtn){
  try{
    await video.play();
    tapBtn.style.display = 'none';
    statusEl.textContent = '請將 QR Code 對準框內';
    statusEl.className = 'status-line';
  }catch(err){
    // iOS 常常需要「再點一次」畫面才會真的開始播放
    tapBtn.style.display = 'block';
    statusEl.textContent = '相機已授權，但畫面被瀏覽器擋住了，請點下方按鈕一次';
  }
}

let scanMatchTimer = null;

async function startScanner(){
  const statusEl = document.getElementById('scanStatus');
  const btn = document.getElementById('btn-start-scan');
  const video = document.getElementById('qrVideo');
  const tapBtn = document.getElementById('tapToPlay');
  btn.classList.remove('show');
  btn.style.display = 'none';
  tapBtn.style.display = 'none';
  statusEl.textContent = '正在啟動相機…';
  statusEl.className = 'status-line';

  // 無論相機是否成功啟動，8 秒後都會模擬掃到守城人的 QR Code
  scanLocked = false;
  clearTimeout(scanMatchTimer);
  scanMatchTimer = setTimeout(showQrMatched, 8000);

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    statusEl.textContent = '這個瀏覽器不支援相機掃描，請改用手機內建的 Safari 或 Chrome 打開這個網址（不要用 LINE／IG 內建瀏覽器）';
    statusEl.className = 'status-line warn';
    return;
  }

  // 先試後鏡頭，若裝置不支援指定條件就退回最基本的請求，避免 OverconstrainedError
  const constraintOptions = [
    { video: { facingMode: { ideal: 'environment' } }, audio: false },
    { video: true, audio: false }
  ];

  let stream = null;
  let lastErr = null;
  for (const c of constraintOptions){
    try{
      stream = await navigator.mediaDevices.getUserMedia(c);
      break;
    }catch(err){ lastErr = err; }
  }

  if (!stream){
    if (lastErr && (lastErr.name === 'NotAllowedError' || lastErr.name === 'PermissionDeniedError')){
      statusEl.textContent = '相機權限被拒絕了，請到手機瀏覽器設定裡允許這個網站使用相機，再重新整理頁面';
    } else if (lastErr && lastErr.name === 'NotFoundError'){
      statusEl.textContent = '找不到可用的相機';
    } else {
      statusEl.textContent = '無法啟用相機，請確認網址是 https 開頭，並用 Safari／Chrome 開啟';
    }
    statusEl.className = 'status-line warn';
    console.error(lastErr);
    return;
  }

  activeStream = stream;
  video.setAttribute('playsinline', 'true');
  video.setAttribute('webkit-playsinline', 'true');
  video.setAttribute('autoplay', 'true');
  video.setAttribute('muted', 'true');
  video.muted = true;
  video.srcObject = stream;

  tapBtn.onclick = () => tryPlayVideo(video, statusEl, tapBtn);
  await tryPlayVideo(video, statusEl, tapBtn);
}

function stopScanner(){
  clearTimeout(scanMatchTimer);
  if(activeStream){
    activeStream.getTracks().forEach(t=>t.stop());
    activeStream = null;
  }
  const tapBtn = document.getElementById('tapToPlay');
  if (tapBtn) tapBtn.style.display = 'none';
  resetScanScene();
}

function resetScanScene(){
  scanLocked = false;
  const startBtn = document.getElementById('btn-start-scan');
  const continueBtn = document.getElementById('btn-scan-continue');
  const resultWrap = document.getElementById('qrResultWrap');
  const scanLine = document.getElementById('scanLine');
  const statusEl = document.getElementById('scanStatus');
  if(startBtn){ startBtn.style.display = 'inline-block'; startBtn.classList.add('show'); }
  if(continueBtn){ continueBtn.style.display = 'none'; continueBtn.classList.remove('show'); }
  if(resultWrap) resultWrap.classList.remove('show');
  if(scanLine) scanLine.classList.remove('paused');
  if(statusEl){ statusEl.textContent = '請將守城人給的 QR Code 對準框內'; statusEl.className = 'status-line'; }
}

let scanLocked = false;
function showQrMatched(){
  if(scanLocked) return;
  scanLocked = true;

  const statusEl = document.getElementById('scanStatus');
  const scanLine = document.getElementById('scanLine');
  const resultWrap = document.getElementById('qrResultWrap');
  const continueBtn = document.getElementById('btn-scan-continue');

  // 停止相機畫面上的掃描動畫，並在框內顯示已掃到的 QR Code 圖片
  if(scanLine) scanLine.classList.add('paused');
  if(resultWrap) resultWrap.classList.add('show');

  statusEl.textContent = '✦ 印記已核實，城門為你而開 ✦';
  statusEl.className = 'status-line ok';

  if(continueBtn){
    continueBtn.style.display = 'inline-block';
    requestAnimationFrame(()=> continueBtn.classList.add('show'));
  }
}

/* ---------------- 場景 3：答案輸入 ---------------- */
function checkAnswer(e){
  e.preventDefault();
  const input = document.getElementById('answerInput');
  const hint = document.getElementById('answerHint');
  const val = input.value.trim();

  if(val.toLowerCase() === CORRECT_ANSWER.toLowerCase()){
    goToScene('scene-reveal');
  }else{
    hint.classList.remove('show');
    void hint.offsetWidth; // 觸發重播 shake 動畫
    hint.classList.add('show');
  }
  return false;
}

/* ---------------- 啟動 ---------------- */
playIntro();
</script>
</body>
